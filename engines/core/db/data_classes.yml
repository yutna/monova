# DATA-11: the data class of every column of core's tables. The kernel
# spec in engines/core/spec/monova/core/data_classes_spec.rb compares this
# file with the PostgreSQL catalog, so a new column cannot arrive without a
# class. The five classes are public, internal, personal, sensitive and
# secret; a column whose class is unclear is classed higher, not lower.
core_tenants:
  id: internal
  name: internal
  created_at: internal
  updated_at: internal
core_users:
  id: internal
  email: personal
  email_digest: secret
  password_digest: secret
  created_at: internal
  updated_at: internal
core_memberships:
  id: internal
  tenant_id: internal
  user_id: internal
  role: public
  status: public
  created_at: internal
  updated_at: internal
