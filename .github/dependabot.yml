version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies]
    assignees: [yutna]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    groups:
      bundler:
        update-types: [minor, patch]
    labels: [dependencies]
    assignees: [yutna]
    commit-message:
      prefix: chore
      include: scope
