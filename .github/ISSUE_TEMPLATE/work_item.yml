name: Work item
description: A brief for one pull request (written by the lead)
labels: ["owner: implementer"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two sentences on the outcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Links the implementer must read: rule IDs, ADRs, spec sections, files.
        Nothing else is required reading.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What to change, as a list.
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: What not to change, even if it looks related.
  - type: textarea
    id: files
    attributes:
      label: Files
      description: The files or globs the implementer may touch.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: >-
        A checklist. Each criterion names the command or file that proves it.
    validations:
      required: true
  - type: input
    id: depends_on
    attributes:
      label: Depends on
      description: Issue numbers that must close first, for example "#12, #13".
