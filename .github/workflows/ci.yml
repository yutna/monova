name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # A weekly rebuild catches a base image or upstream package that rots.
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # WF-05: a Gemfile.lock that does not match the Gemfile fails every job.
  BUNDLE_FROZEN: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      devcontainer: ${{ steps.pin.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect a changed pin file
        id: pin
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A schedule or a manual run always proves the container, and a push
          # without a usable base (a new branch, after a force push) does too.
          if [ "${EVENT_NAME}" = "schedule" ] || [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # OPS-01 pin files. The check exits 1 when any of them differs.
          if git diff --quiet "${BASE_SHA}" "${GITHUB_SHA}" -- \
            mise.toml Gemfile.lock package-lock.json .devcontainer Dockerfile \
            .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  devcontainer:
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Dev Container runs as vscode (UID 1000), while the GitHub runner
      # checks the workspace out as another user, so give the bind mount to the
      # container user before anything writes to it.
      - name: Own the workspace as the container user
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Build the Dev Container
        run: docker compose -f .devcontainer/compose.yaml build app

      - name: Start the Dev Container
        run: docker compose -f .devcontainer/compose.yaml up --detach

      # The image installs the toolchains from mise.toml; the Dev Container's
      # postCreateCommand installs the gems and prepares the databases, so the
      # job runs the same command before the gate (OPS-01).
      - name: Prepare the Dev Container
        run: docker compose -f .devcontainer/compose.yaml exec -T -e BUNDLE_FROZEN=true app bin/setup --skip-server

      - name: Run bin/ci in the Dev Container
        run: docker compose -f .devcontainer/compose.yaml exec -T -e BUNDLE_FROZEN=true app bin/ci

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  scan_ruby:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: "Database: roles"
        run: bin/db-roles

      - name: "Tests: RSpec"
        run: bin/rails db:test:prepare && bin/db-roles && bin/rspec

      - name: "Tests: Seeds"
        run: env RAILS_ENV=test bin/rails db:seed:replant

  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node

      - name: Install npm dependencies
        run: npm ci

      - name: Lint Markdown
        run: npm run lint:md

  guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lead guard canary
        run: script/ci/lead_guard_canary

      - name: Documentation check
        run: script/docs/check

      - name: Documentation check canary
        run: script/docs/canary

      - name: PostgreSQL image check
        run: script/ci/postgres_image_check

      - name: PostgreSQL image check canary
        run: script/ci/postgres_image_check --canary

      - name: OpenCode policy check
        run: script/ci/opencode_policy_check

      - name: OpenCode policy canary
        run: script/ci/opencode_policy_check --canary

      - name: Main branch ruleset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: script/ci/ruleset_check

      - name: Main branch ruleset canary
        run: script/ci/ruleset_check --canary

  loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y shellcheck
          fi
          shellcheck script/loop/driver script/loop/install \
            script/loop/uninstall script/loop/test \
            script/dev/postgres bin/docker-entrypoint

      - name: Loop driver self-test
        run: script/loop/test

  ci-ok:
    if: always()
    # A devcontainer job skipped because no pin file changed is not a failure.
    # The check below fails only on a job that failed or was cancelled, so a
    # skipped devcontainer counts as passing (WF-02).
    needs: [changes, devcontainer, actionlint, scan_ruby, lint, test, markdown, guards, loop]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false
